name: "CodeQL"

# Run on all PRs to sw branch - use path filter inside job
# This ensures the check always reports a status (success or skipped)
# Scheduled and manual runs always analyze, keeping the sw analysis current
on:
  push:
    branches: [sw]
  pull_request:
    branches: [sw]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DISABLE: true

jobs:
  # Check if CodeQL-relevant paths were changed
  changes:
    name: CodeQL
    runs-on: ubuntu-latest
    # Repository default token is read-only; the empty SARIF upload needs write
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    outputs:
      should_run: ${{ steps.filter.outputs.codeql == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            codeql:
              - 'src/libstrongswan/plugins/pgsql/**'
              - 'src/libstrongswan/database/**'
              - 'src/libstrongswan/networking/streams/stream_service_unix.c'
              - 'src/libcharon/plugins/dhcp_inform/**'
              - 'src/libcharon/plugins/sql/**'
              - 'src/pool/**'
              - 'configure.ac'
      - name: Report status
        run: |
          if [ "${{ steps.filter.outputs.codeql }}" == "true" ]; then
            echo "CodeQL-relevant paths changed, will run analysis"
          else
            echo "No CodeQL-relevant paths changed, skipping analysis"
          fi

      # Upload empty SARIF when skipping to satisfy the code scanning rule on
      # PRs. Never on push: an empty result on sw would replace the default
      # branch analysis and close its alerts.
      - name: Upload empty SARIF (skip case)
        if: github.event_name == 'pull_request' && steps.filter.outputs.codeql != 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/.github/codeql/empty.sarif
          category: "/language:cpp"

  analyze:
    name: Analyze
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: cpp
        # Scope queries to our paths only
        config: |
          paths:
            - src/libstrongswan/plugins/pgsql
            - src/libstrongswan/database
            - src/libstrongswan/networking/streams/stream_service_unix.c
            - src/libcharon/plugins/dhcp_inform
            - src/libcharon/plugins/sql
            - src/pool
          query-filters:
            - exclude:
                id: cpp/fixme-comment
            - exclude:
                id: cpp/wrong-type-format-argument

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential autoconf automake libtool pkg-config \
          libgmp-dev libssl-dev libpq-dev libsystemd-dev \
          gperf flex bison

    - name: Build for CodeQL analysis
      run: |
        autoreconf -i
        ./configure \
          --enable-pgsql \
          --enable-sql \
          --enable-attr-sql \
          --enable-vici \
          --enable-systemd \
          --enable-openssl \
          --enable-dhcp-inform
        # Build libstrongswan, libcharon and pool (contain our changes);
        # the pool binary itself is gated on --enable-attr-sql (USE_ATTR_SQL
        # in src/pool/Makefile.am), --enable-sql alone only ships templates
        make -C src/libstrongswan -j"$(nproc)"
        make -C src/libcharon -j"$(nproc)"
        make -C src/pool -j"$(nproc)"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:cpp"
